<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}GitSim{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.17/codemirror.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.17/codemirror.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.17/mode/shell/shell.min.js"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free/js/all.min.js"></script>

    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body class="bg-white text-gray-900">

    <!-- Navbar -->
    <nav class="bg-gray-900 shadow-lg p-4 fixed w-full top-0 z-50">
        <div class="container mx-auto flex justify-between items-center">
            <!-- Logo -->
            <a href="/" class="text-2xl font-bold flex items-center gap-2 text-gray-300 hover:text-white transition-all duration-300">
                <i class="ph ph-git-branch text-indigo-500 text-3xl"></i> GitSim
            </a>

            <!-- Hamburger Menu Button (Visible on Mobile) -->
            <button id="menu-toggle" class="md:hidden text-gray-300 hover:text-white focus:outline-none">
                <i class="fas fa-bars text-2xl"></i>
            </button>

            <!-- Navbar Links -->
            <div id="nav-links" class="hidden md:flex md:items-center md:space-x-8 flex-col md:flex-row absolute md:static top-16 left-0 w-full md:w-auto bg-gray-900 md:bg-transparent p-4 md:p-0 transition-all duration-300">
                <a href="/" class="text-gray-300 hover:text-white transition-all duration-300 flex items-center gap-2 py-2 md:py-0">
                    <i class="fa fa-home text-lg"></i> Home
                </a>
                <a href="#features" class="text-gray-300 hover:text-white transition-all duration-300 flex items-center gap-2 py-2 md:py-0">
                    <i class="fa fa-cogs text-lg"></i> Features
                </a>
                <a href="#team" class="text-gray-300 hover:text-white transition-all duration-300 flex items-center gap-2 py-2 md:py-0">
                    <i class="fa fa-user text-lg"></i> Developers
                </a>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="min-h-screen pt-20">
        {% block content %}{% endblock %}
    </div>

    <!-- Footer -->
    <footer class="bg-gray-900 text-white p-4 text-center">
        <p>© 2025 GitSim. All rights reserved.</p>
    </footer>

    <!-- JavaScript for Navbar Toggle -->
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const menuToggle = document.getElementById("menu-toggle");
            const navLinks = document.getElementById("nav-links");

            menuToggle.addEventListener("click", function () {
                navLinks.classList.toggle("hidden");
            });

            // Optional: Close menu when clicking a link on mobile
            navLinks.querySelectorAll("a").forEach(link => {
                link.addEventListener("click", () => {
                    if (!navLinks.classList.contains("md:flex")) {
                        navLinks.classList.add("hidden");
                    }
                });
            });
        });
    </script>
</body>
</html>
