{% extends "base.html" %}
{% block title %}GitSim - Simulation{% endblock %}
{% block content %}

<div class="container mx-auto p-6">
    <div class="flex flex-col md:flex-row gap-8">
        
        <!-- Left Panel: Controls -->
        <div class="md:w-1/3 flex flex-col gap-6">
            
            <!-- Add File -->
            <div class="bg-gray-100 dark:bg-gray-800 p-5 rounded-xl shadow-lg transition-all hover:shadow-2xl">
                <h2 class="text-xl font-semibold text-gray-900 dark:text-gray-100 flex items-center gap-2">
                    <i class="ph ph-file-plus text-blue-500"></i> Add File
                </h2>
                <input id="filename" type="text" class="w-full p-3 mt-3 border rounded-lg bg-gray-50 dark:bg-gray-700 text-gray-900 dark:text-gray-200" placeholder="Filename (e.g., main.py)">
                <textarea id="content" class="w-full p-3 mt-2 border rounded-lg bg-gray-50 dark:bg-gray-700 text-gray-900 dark:text-gray-200" placeholder="File content"></textarea>
                <button onclick="addFile()" class="mt-3 w-full bg-blue-600 text-white p-3 rounded-lg font-semibold hover:bg-blue-700 transition-all">
                    Add <i class="ph ph-check"></i>
                </button>
            </div>

            <!-- Commit -->
            <div class="bg-gray-100 dark:bg-gray-800 p-5 rounded-xl shadow-lg transition-all hover:shadow-2xl">
                <h2 class="text-xl font-semibold text-gray-900 dark:text-gray-100 flex items-center gap-2">
                    <i class="ph ph-git-commit text-green-500"></i> Commit
                </h2>
                <input id="commitMessage" type="text" class="w-full p-3 mt-3 border rounded-lg bg-gray-50 dark:bg-gray-700 text-gray-900 dark:text-gray-200" placeholder="Commit message">
                <button id="commitButton" onclick="commit()" class="mt-3 w-full bg-green-600 text-white p-3 rounded-lg font-semibold hover:bg-green-700 transition-all opacity-50" disabled>
                    Commit <i class="ph ph-arrow-circle-right"></i>
                </button>
            </div>

            <!-- Create Branch -->
            <div class="bg-gray-100 dark:bg-gray-800 p-5 rounded-xl shadow-lg transition-all hover:shadow-2xl">
                <h2 class="text-xl font-semibold text-gray-900 dark:text-gray-100 flex items-center gap-2">
                    <i class="ph ph-git-branch text-purple-500"></i> Create Branch
                </h2>
                <input id="branchName" type="text" class="w-full p-3 mt-3 border rounded-lg bg-gray-50 dark:bg-gray-700 text-gray-900 dark:text-gray-200" placeholder="Branch name">
                <button onclick="createBranch()" class="mt-3 w-full bg-purple-600 text-white p-3 rounded-lg font-semibold hover:bg-purple-700 transition-all">
                    Create <i class="ph ph-git-branch"></i>
                </button>
            </div>

            <!-- Switch Branch -->
            <div class="bg-gray-100 dark:bg-gray-800 p-5 rounded-xl shadow-lg transition-all hover:shadow-2xl">
                <h2 class="text-xl font-semibold text-gray-900 dark:text-gray-100 flex items-center gap-2">
                    <i class="ph ph-git-branch text-blue-500"></i> Switch Branch
                </h2>
                <select id="branchSelector" class="w-full p-3 mt-3 border rounded-lg bg-gray-50 dark:bg-gray-700 text-gray-900 dark:text-gray-200">
                    <!-- Options will be dynamically populated -->
                </select>
                <button onclick="switchBranch()" class="mt-3 w-full bg-blue-600 text-white p-3 rounded-lg font-semibold hover:bg-blue-700 transition-all">
                    Switch <i class="ph ph-arrow-right"></i>
                </button>
            </div>

        </div>

        <!-- Right Panel: Commit Graph and Staging Area -->
        <div class="md:w-2/3 flex flex-col gap-6">
            
            <!-- Current and Previous Branch Display -->
            <div class="bg-gray-100 dark:bg-gray-800 p-4 rounded-xl shadow-lg">
                <h2 class="text-lg font-semibold text-gray-900 dark:text-gray-100">
                    Current Branch: <span id="current-branch" class="font-bold text-blue-500">main</span>
                </h2>
                <h2 class="text-lg font-semibold text-gray-900 dark:text-gray-100">
                    Previous Branch: <span id="previous-branch" class="font-bold text-gray-500">None</span>
                </h2>
            </div>
            
            <!-- Staging Area -->
            <div class="bg-gray-100 dark:bg-gray-800 p-5 rounded-xl shadow-lg transition-all">
                <h2 class="text-xl font-semibold text-gray-900 dark:text-gray-100 flex items-center gap-2">
                    <i class="ph ph-clipboard text-orange-500"></i> Staging Area
                </h2>
                <ul id="stagingList" class="list-disc ml-5 text-gray-900 dark:text-gray-200 mt-3"></ul>
            </div>
            
            <!-- Commit History -->
            <div class="bg-gray-100 dark:bg-gray-800 p-5 rounded-xl shadow-lg transition-all">
                <h2 class="text-xl font-semibold text-gray-900 dark:text-gray-100 flex items-center gap-2">
                    <i class="ph ph-history text-teal-500"></i> Commit History
                </h2>
                <ul id="commitList" class="list-disc ml-5 text-gray-900 dark:text-gray-200 mt-3"></ul>
            </div>
            
            <!-- Commit Graph -->
            <div class="bg-gray-100 dark:bg-gray-800 p-6 rounded-xl shadow-lg transition-all">
                <h2 class="text-xl font-semibold text-gray-900 dark:text-gray-100 flex items-center gap-2">
                    <i class="ph ph-git-graph text-yellow-500"></i> Commit Graph
                </h2>
                <canvas id="commitGraph" class="w-full mt-4 bg-gray-50 dark:bg-gray-700 p-3 rounded-lg shadow-md" height="500"></canvas>
            </div>
            
            <!-- Merge Branch
            <div class="bg-gray-100 dark:bg-gray-800 p-5 rounded-xl shadow-lg transition-all hover:shadow-2xl">
                <h2 class="text-xl font-semibold text-gray-900 dark:text-gray-100 flex items-center gap-2">
                    <i class="ph ph-git-merge text-red-500"></i> Merge Branch
                </h2>
                <input id="sourceBranch" type="text" class="w-full p-3 mt-3 border rounded-lg bg-gray-50 dark:bg-gray-700 text-gray-900 dark:text-gray-200" placeholder="Source branch">
                <button onclick="mergeBranch()" class="mt-3 w-full bg-red-600 text-white p-3 rounded-lg font-semibold hover:bg-red-700 transition-all">
                    Merge <i class="ph ph-git-merge"></i>
                </button>
            </div> -->

        </div>
    </div>
</div>

<script src="static\script.js"></script>
{% endblock %}
